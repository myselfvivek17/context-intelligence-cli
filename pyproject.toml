[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-intelligence-cli"
version = "0.1.0"
description = "CLI tool for managing contextual memory and skills with Qdrant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "typer>=0.9.0",
    "questionary>=2.0.0",
    "qdrant-client[fastembed]>=1.7.0",
    "pydantic>=2.0.0",
    "fastembed>=0.2.0",
]

[project.scripts]
context-cli = "context_intelligence.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
